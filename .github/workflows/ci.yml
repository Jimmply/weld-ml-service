name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Train the bundled baseline model
        # The service lazily trains at startup if models/ is empty, but doing
        # it ahead of time means the test suite isn't paying the training cost.
        run: PYTHONPATH=src python scripts/train_baseline.py

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t weld-ml-service:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name weld-ml-ci -p 8000:8000 weld-ml-service:ci
          # Wait up to 30s for /health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "health OK after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep '"status":"ok"'
          curl -sf -X POST http://127.0.0.1:8000/predict \
            -H 'content-type: application/json' \
            -d '{"peak_power_W":2100,"pulse_duration_ms":10,"spot_diameter_mm":0.7,"travel_speed_mm_s":25,"assist_gas_flow_lpm":15}' \
            | grep '"label"'
          docker stop weld-ml-ci
